[build-system]
requires      = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
authors = [
    { name = "darkshapes", email = "91800957+exdysa@users.noreply.github.com" },
]
description = "Machine Intelligence Resource URI Schema"
license = { file = "LICENSE" }
name = "MIR"
readme = "README.md"
requires-python = ">= 3.11"
version = "0.0.1"
keywords = ["ML", "AI", "URI", "schema", "diffusion", "LLM", "identification"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Lesser General Public License v3 (LGPLv3)",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "chanfig>=0.0.114",
    "diffusers>=0.35.2",
    "ftfy>=6.3.1",
    "huggingface-hub[hf-xet]>=1.1.7",
    "numpy>=2.4.1",
    "pydantic>=2.12.5",
    "sentencepiece>=0.2.1",
    "tokenizers>=0.22.1",
    "torch>=2.9.1",
    "torchvision>=0.24.1",
    "transformers>=2.3.0",
]
[project.urls]
Homepage      = "https://github.com/darkshapes/MIR"
Documentation = "https://github.com/darkshapes/sdbx/wiki"

[project.scripts]
mir = "mir.generate.__main__:main"
mir-nn = "mir.nn_walk:main"

[tool.setuptools_scm]
version_scheme = "guess-next-dev"
local_scheme = "no-local-version"

[tool.setuptools.package-data]
"*" = ["*.txt", "*.md", "*.json"]

[tool.setuptools.packages.find]
where   = ["."]
include = ["mir*"]
exclude = ["tests*"]

[tool.uv.sources]
transformers = { git = "https://github.com/huggingface/transformers" }
diffusers = { git = "https://github.com/huggingface/diffusers" }

[dependency-groups]
dev = [
    "pdoc>=16.0.0",
    "pyright>=1.1.407",
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.14.7",
]

[tool.ruff.lint]
ignore = ["E731"]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning",
]
